<svg xmlns="http://www.w3.org/2000/svg" width="460" height="190" viewBox="0 0 460 190" role="img" aria-label="Linguagens mais usadas nos repositórios públicos: JavaScript 47,9%, HTML 31,1%, CSS 21,0%">
  <style>
    .card { fill: #0d1117; stroke: #30363d; }
    .h { font: 700 16px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #e6edf3; }
    .l { font: 500 13px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #c9d1d9; }
    .bar { transform-origin: 0 0; animation: grow 1.6s cubic-bezier(.2,.8,.2,1) both; }
    .b2 { animation-delay: .25s; } .b3 { animation-delay: .5s; }
    @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  </style>
  <rect class="card" x=".5" y=".5" width="459" height="189" rx="10"/>
  <text class="h" x="20" y="30">Linguagens mais usadas</text>
  <clipPath id="c"><rect x="20" y="46" width="420" height="12" rx="6"/></clipPath>
  <rect x="20" y="46" width="420" height="12" rx="6" fill="#21262d"/>
  <g clip-path="url(#c)">
    <rect class="bar" x="20" y="46" width="201" height="12" fill="#f1e05a"/>
    <rect class="bar b2" x="221" y="46" width="131" height="12" fill="#e34c26"/>
    <rect class="bar b3" x="352" y="46" width="88" height="12" fill="#563d7c"/>
  </g>
  <circle cx="28" cy="88" r="6" fill="#f1e05a"/><text class="l" x="42" y="93">JavaScript — 47,9%</text>
  <circle cx="28" cy="116" r="6" fill="#e34c26"/><text class="l" x="42" y="121">HTML — 31,1%</text>
  <circle cx="28" cy="144" r="6" fill="#563d7c"/><text class="l" x="42" y="149">CSS — 21,0%</text>
  <text class="l" x="20" y="175" style="fill:#8b949e;font-size:11px">Repositórios públicos · Lumière Estética e Star Moda Fashion</text>
</svg>
